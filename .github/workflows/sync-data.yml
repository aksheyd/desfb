name: Sync public data

on:
  schedule:
    # Daily mid-morning Pacific (~07:00 PT / 14:00 UTC)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch tides, forecast, season & featured
        run: python3 scripts/sync_today.py

      - name: Commit if data changed
        run: |
          git config user.name "desfb-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/*.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): daily public JSON sync"
            git push
          fi
