name: Data sync

on:
  schedule:
    # Mondays mid-morning Pacific (~07:00 PT / 14:00 UTC)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sightings, names and photos
        run: python3 scripts/build_species.py

      - name: Commit if data changed, then redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "desfb-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/species.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): weekly species sync"
            git push
            # Pushes made with the workflow token do not trigger other workflows.
            gh workflow run pages.yml --ref main
          fi
